<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Research Authoring Workspace</title>
    <style>
      /* Widget ships with zero CSS otherwise -- default browser heading
         margins/font-sizes overlap badly in ChatGPT's iframe without a
         baseline reset (confirmed live: distorted, overlapping heading
         text). */
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
      }
      #root { padding: 16px; }
      h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e5e5e5; }
      li:last-child { border-bottom: none; }
      p { margin: 0 0 8px; }
      button {
        margin-right: 6px;
        padding: 4px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #f7f7f7;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover { background: #eee; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
