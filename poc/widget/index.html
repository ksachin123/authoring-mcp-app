<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Research Authoring Workspace</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1f2328;
        background: #ffffff;
      }
      #root { padding: 20px; max-width: 640px; }

      .workspace-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e8e8ec;
      }
      .workspace-header h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.01em;
        color: #101828;
      }
      .count-badge {
        flex-shrink: 0;
        font-size: 12px;
        font-weight: 600;
        color: #475467;
        background: #f2f4f7;
        padding: 2px 9px;
        border-radius: 999px;
      }

      .artefact-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .artefact-card {
        border: 1px solid #e4e7ec;
        border-radius: 10px;
        padding: 14px 16px;
        background: #fcfcfd;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .artefact-card:hover {
        border-color: #d0d5dd;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      }

      .artefact-type-badge {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #3538cd;
        background: #eef4ff;
        padding: 2px 8px;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .artefact-content { margin: 0 0 10px; color: #1f2328; }

      .artefact-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .citation-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        font-size: 11px;
        font-weight: 600;
        color: #475467;
        background: #f2f4f7;
        border: 1px solid #e4e7ec;
        border-radius: 999px;
        cursor: pointer;
      }
      .citation-chip:hover { background: #e4e7ec; }
      .citation-chip.is-selected {
        background: #3538cd;
        border-color: #3538cd;
        color: #ffffff;
      }

      .approve-button {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        font-weight: 600;
        color: #ffffff;
        background: #17b26a;
        border: 1px solid #079455;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .approve-button:hover { background: #079455; }

      .citation-panel {
        margin-top: 12px;
        padding: 10px 12px;
        background: #eef4ff;
        border-left: 3px solid #3538cd;
        border-radius: 6px;
        font-size: 12.5px;
        color: #364152;
      }

      .empty-state {
        padding: 28px 16px;
        text-align: center;
        color: #667085;
        font-size: 13px;
        border: 1px dashed #e4e7ec;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
