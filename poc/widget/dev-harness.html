<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Widget Dev Harness</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
      }
      #harness-bar {
        padding: 10px 16px;
        background: #222;
        color: #eee;
        font-size: 13px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      #harness-bar button {
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }
      #harness-log {
        padding: 6px 16px;
        background: #333;
        color: #9f9;
        font-size: 11px;
        font-family: monospace;
        max-height: 80px;
        overflow-y: auto;
      }
      #widget-frame-boundary {
        border: 2px dashed #999;
        margin: 16px;
        background: white;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <!--
      Dev harness for iterating on the widget UI without going through
      ChatGPT at all. Mocks window.openai with the same members
      openaiBridge.ts depends on (callTool, widgetState, setWidgetState,
      notifyIntrinsicHeight, notifyIntrinsicWidth), seeded with sample
      artefact data covering the states the widget can actually be in.

      Run: from poc/widget/, after `npm run build`:
        npx serve .
      then open http://localhost:3000/dev-harness.html (port may vary --
      `serve` prints the actual URL). Reloading picks up any rebuild.

      This is NOT part of the built widget and is never served to ChatGPT --
      it only ever loads dist/bundle.js directly over a normal HTTP origin,
      which is why a relative <script src> works here but not inside the
      real ui:// resource (see server.py's report_workspace_widget()).

      Widget CSS is fetched from dist/index.html at runtime (see the
      injectRealWidgetCss() script below) rather than duplicated here --
      an earlier version hand-copied it and it silently drifted out of
      sync with the real styling within the same session. This may cause
      a brief flash of unstyled content on load; that's fine for a dev tool.
    -->
    <div id="harness-bar">
      <strong>Widget Dev Harness</strong>
      <span>scenario:</span>
      <button onclick="loadScenario('pending')">pending artefacts</button>
      <button onclick="loadScenario('empty')">no pending artefacts</button>
      <button onclick="loadScenario('many')">many artefacts (scroll/size test)</button>
      <button onclick="location.reload()">reload bundle</button>
    </div>
    <div id="harness-log"></div>
    <div id="widget-frame-boundary">
      <div id="root"></div>
    </div>

    <script>
      // Single source of truth for widget CSS is dist/index.html -- fetch
      // its <style> block and inject it here instead of hand-copying it.
      fetch('./dist/index.html')
        .then((r) => r.text())
        .then((html) => {
          const match = html.match(/<style>([\s\S]*?)<\/style>/);
          if (!match) return;
          const styleEl = document.createElement('style');
          styleEl.textContent = match[1];
          document.head.appendChild(styleEl);
        });

      const SCENARIOS = {
        pending: [
          {
            id: 'artefact-1',
            type: 'thesis_point',
            status: 'pending_approval',
            content: 'Revenue grew 18.3% YoY to $82.9bn, driven by Azure growth of 40% and Microsoft Cloud growth of 29%.',
            claim_ids: ['claim-1', 'claim-2'],
          },
          {
            id: 'artefact-2',
            type: 'data_extract',
            status: 'pending_approval',
            content: 'FactSet consensus target price of $555.30 implies approximately 45% upside from the last close of $381.70.',
            claim_ids: ['claim-3'],
          },
          {
            id: 'artefact-3',
            type: 'comparison_table',
            status: 'approved',
            content: '(already approved -- should NOT appear in the pending list below)',
            claim_ids: [],
          },
        ],
        empty: [],
        many: Array.from({ length: 12 }, (_, i) => ({
          id: `artefact-${i}`,
          type: i % 2 === 0 ? 'thesis_point' : 'data_extract',
          status: 'pending_approval',
          content: `Sample artefact #${i + 1} -- ${'lorem ipsum dolor sit amet '.repeat(3)}`,
          claim_ids: [`claim-${i}-1`, `claim-${i}-2`],
        })),
      };

      function log(msg) {
        const el = document.getElementById('harness-log');
        el.textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + el.textContent;
      }

      let currentArtefacts = SCENARIOS.pending;

      window.openai = {
        widgetState: { artefacts: currentArtefacts },
        setWidgetState(state) {
          log(`setWidgetState(${JSON.stringify(state).slice(0, 120)})`);
          window.openai.widgetState = state;
        },
        async callTool(name, args) {
          log(`callTool(${name}, ${JSON.stringify(args)})`);
          // Real window.openai.callTool() hands back structuredContent as an
          // actual object, never a JSON string -- an earlier version of this
          // mock returned JSON.stringify(...) here, which masked a real bug
          // (entry.tsx/ReportWorkspace.tsx both called JSON.parse() on what
          // ChatGPT actually hands back as an already-parsed object,
          // producing `"[object Object]" is not valid JSON` live in
          // ChatGPT, not caught locally because this mock didn't match
          // production's actual shape). Return real objects, matching each
          // tool's real structuredContent shape exactly.
          if (name === 'list_pending_artefacts_tool') {
            return { result: currentArtefacts.filter((a) => a.status === 'pending_approval') };
          }
          if (name === 'approve_artefact_tool') {
            const artefact = currentArtefacts.find((a) => a.id === args.artefact_id);
            if (artefact) artefact.status = 'approved';
            return { artefact: { ...artefact } };
          }
          return { note: 'unmocked tool call', name, args };
        },
        notifyIntrinsicHeight(height) {
          log(`notifyIntrinsicHeight(${height})`);
        },
        notifyIntrinsicWidth(width) {
          log(`notifyIntrinsicWidth(${width})`);
        },
      };

      function loadScenario(name) {
        // Navigate with ?scenario= rather than a plain reload -- the widget
        // only reads widgetState.artefacts once at mount, and window.openai
        // is reconstructed fresh on every page load, so the choice has to
        // survive via the URL, not in-memory state.
        location.search = `?scenario=${encodeURIComponent(name)}`;
      }

      // Persist the chosen scenario across the reload loadScenario() triggers
      // (the widget only reads widgetState.artefacts once, at mount).
      const params = new URLSearchParams(location.search);
      const scenario = params.get('scenario') || 'pending';
      window.openai.widgetState = { artefacts: SCENARIOS[scenario] };
      currentArtefacts = SCENARIOS[scenario];
    </script>
    <script type="module" src="./dist/bundle.js"></script>
  </body>
</html>
